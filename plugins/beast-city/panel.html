<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异兽迷城 · 管理面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#ccc;padding:16px}
h1{color:#e0b040;margin-bottom:16px}
h2{border-bottom:1px solid #333;padding-bottom:8px;margin-bottom:12px;color:#e0b040}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab-btn{padding:6px 16px;border:1px solid #444;background:#1a1a1a;color:#aaa;cursor:pointer;border-radius:4px 4px 0 0;font-size:13px}
.tab-btn.active{background:#2a1a0a;border-color:#e0b040;color:#e0b040}
.tab-content{display:none}
.tab-content.active{display:block}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 10px;border:1px solid #333;text-align:left;font-size:13px}
th{background:#1a1a1a;color:#e0b040}
input,textarea,select{background:#1a1a1a;border:1px solid #444;color:#ccc;padding:4px 8px;border-radius:3px;width:100%;font-size:13px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin:8px 0 4px;font-size:12px;color:#999}
button{padding:6px 16px;background:#e0b040;color:#111;border:none;border-radius:3px;cursor:pointer;font-weight:bold;font-size:13px}
button:hover{background:#f0c050}
.row{display:flex;gap:8px}
.row>div{flex:1}
pre{background:#111;padding:8px;border-radius:3px;font-size:12px;overflow-x:auto;max-height:300px}
</style>
</head>
<body>
<h1>异兽迷城 · 管理面板</h1>
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('players')">玩家列表</button>
  <button class="tab-btn" onclick="showTab('config')">游戏配置</button>
  <button class="tab-btn" onclick="showTab('story')">剧情概览</button>
</div>

<div id="players" class="tab-content active">
  <h2>玩家存档</h2>
  <button onclick="loadPlayers()">刷新</button>
  <table id="playerTable"><tbody></tbody></table>
</div>

<div id="config" class="tab-content">
  <h2>游戏配置</h2>
  <button onclick="loadConfig()">刷新</button>
  <div id="configForm"></div>
  <button onclick="saveConfig()" style="margin-top:12px">保存配置</button>
</div>

<div id="story" class="tab-content">
  <h2>剧情事件概览</h2>
  <button onclick="loadStory()">刷新</button>
  <div id="storyList"></div>
</div>

<script>
const TOKEN = new URLSearchParams(window.location.search).get("token") || "";
const API = "/api/ext/beast-city";

async function api(path, method, body) {
  var opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN } };
  if (body) opts.body = JSON.stringify(body);
  return fetch(API + path, opts).then(function(r) { return r.json(); });
}

function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(e){ e.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(e){ e.classList.remove('active'); });
  document.getElementById(name).classList.add('active');
  if (name === 'players') loadPlayers();
  else if (name === 'config') loadConfig();
  else if (name === 'story') loadStory();
}

async function loadPlayers() {
  var users = await api('/users');
  var tbody = document.querySelector('#playerTable tbody');
  tbody.innerHTML = users.length === 0
    ? '<tr><td colspan="4">暂无玩家数据</td></tr>'
    : '<tr><th>用户ID</th><th>事件进度</th><th>生命</th><th>回档</th></tr>' +
      users.map(function(u){ return '<tr><td>'+u.user_id.slice(0,12)+'...</td><td>#'+u.event_id+'</td><td>'+(u.stats.hp||0)+'</td><td>'+u.checkpoints+'</td></tr>'; }).join('');
}

async function loadConfig() {
  var cfg = await api('/config');
  var form = document.getElementById('configForm');
  var vals = cfg.values || {};
  var labels = cfg.labels || {};
  var keys = cfg.keys_order || Object.keys(vals);
  form.innerHTML = keys.map(function(k){
    var label = labels[k] || k;
    var val = vals[k] !== undefined ? vals[k] : '';
    return '<label>'+label+'</label><input name="'+k+'" value="'+val+'" type="number">';
  }).join('');
}

async function saveConfig() {
  var inputs = document.querySelectorAll('#configForm input');
  var data = {};
  inputs.forEach(function(inp){ data[inp.name] = inp.type==='number' ? Number(inp.value) : inp.value; });
  var result = await api('/config/save', 'POST', data);
  alert(result.success ? '保存成功' : '保存失败: ' + result.error);
}

async function loadStory() {
  var chapters = await api('/story');
  var div = document.getElementById('storyList');
  div.innerHTML = chapters.map(function(ch){
    return '<h3>'+ch.name+' ('+ch.key+')</h3>' +
      ch.events.map(function(ev){
        return '<div style="margin:4px 0;padding:4px;background:#111;border-radius:3px">' +
          '<b>#'+ev.id+'</b> '+ev.text+'...' +
          '<br><small>选项: '+ev.opts.join(' | ')+'</small></div>';
      }).join('');
  }).join('<hr style="border-color:#333;margin:8px 0">');
}
</script>
</body>
</html>
